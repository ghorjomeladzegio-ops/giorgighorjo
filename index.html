<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="container">
        <div class="box">
            <img class="shopicon" src="./shopping-cart.png" alt="shopicon">
            
            <input class="logininput" id="username" type="text" placeholder="USERNAME">
            
            <input class="logininput" id="password" type="password" placeholder="PASSWORD">
            
            <button class="login" id="loginbtn">LOGIN</button>
            
            <div class="forgot">
                <a class="forgot-password" href="#">Forgot password?</a>
            </div>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
